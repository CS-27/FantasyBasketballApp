{% extends "base.html" %}

{% block title %}Team Analysis - Fantasy Basketball Analyzer{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">

    <div style="margin-bottom: 32px;">
        <h1 class="page-title">Team Analysis</h1>
        <p class="body-text" style="margin-top: 4px;">Your category rankings, strengths, and weaknesses.</p>
    </div>

    <div class="surface-card">
        <div class="card-header">
            <h2 class="section-heading">Category Breakdown</h2>
            <div class="htmx-indicator" id="team-spinner">
                <div class="spinner"></div>
            </div>
        </div>
        <div class="card-body"
             hx-get="/analysis/team-data"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#team-spinner">
            <div class="loading-placeholder">
                <div class="spinner"></div>
                <span>Analyzing your team...</span>
            </div>
        </div>
    </div>

</div>
{% endblock %}
