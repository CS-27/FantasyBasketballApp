{% extends "base.html" %}

{% block title %}Pickup Suggestions - Fantasy Basketball Analyzer{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white">Pickup Suggestions</h1>
        <p class="mt-1 text-gray-400">Combined pickup and drop recommendations to improve your weakest categories.</p>
    </div>

    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg">
        <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-white">Suggestions</h2>
            <div class="htmx-indicator" id="pickups-spinner">
                <svg class="animate-spin h-5 w-5 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
        <div class="p-6"
             hx-get="/premium/pickups-data"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#pickups-spinner">
            <div class="flex items-center justify-center py-12 text-gray-500">
                <svg class="animate-spin h-8 w-8 text-purple-400 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Analyzing pickup and drop candidates...</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
