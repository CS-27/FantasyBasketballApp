{% extends "base.html" %}

{% block title %}Pickup Suggestions - Fantasy Basketball Analyzer{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">

    <div style="margin-bottom: 32px;">
        <h1 class="page-title">Pickup Suggestions</h1>
        <p class="body-text" style="margin-top: 4px;">Combined pickup and drop recommendations to improve your weakest categories.</p>
    </div>

    <div class="surface-card">
        <div class="card-header">
            <h2 class="section-heading">Suggestions</h2>
            <div class="htmx-indicator" id="pickups-spinner">
                <div class="spinner"></div>
            </div>
        </div>
        <div class="card-body"
             hx-get="/premium/pickups-data"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#pickups-spinner">
            <div class="loading-placeholder">
                <div class="spinner"></div>
                <span>Analyzing pickup and drop candidates...</span>
            </div>
        </div>
    </div>

</div>
{% endblock %}
