{% extends "base.html" %}
{% block title %}League Comparison - Fantasy Basketball Analyzer{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto">

    <div style="margin-bottom: 32px;">
        <h1 class="page-title">League Comparison</h1>
        <p class="body-text" style="margin-top: 4px;">Compare your stats against the league average and individual opponents.</p>
    </div>

    <div id="comparison-content"
         hx-get="/analysis/comparison-data"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="surface-card">
            <div class="loading-placeholder">
                <div class="spinner"></div>
                <span>Comparing your team...</span>
            </div>
        </div>
    </div>

</div>
{% endblock %}
