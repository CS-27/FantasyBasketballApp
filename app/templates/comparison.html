{% extends "base.html" %}
{% block title %}League Comparison - Fantasy Basketball Analyzer{% endblock %}
{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white">League Comparison</h1>
        <p class="mt-1 text-gray-400">Compare your stats against the league average.</p>
    </div>
    <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-8 text-center">
        <div class="w-16 h-16 bg-blue-600/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
        </div>
        <h2 class="text-xl font-semibold text-white mb-2">Coming Soon</h2>
        <p class="text-gray-400">League comparison will be available in the next update.</p>
    </div>
</div>
{% endblock %}
